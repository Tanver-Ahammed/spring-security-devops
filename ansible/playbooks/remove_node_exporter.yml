- name: Uninstall Node Exporter and clean up
  hosts: all
  become: yes

  vars:
    node_exporter_install_dir: "/opt"
    node_exporter_systemd_service: "/etc/systemd/system/node_exporter.service"

  tasks:
    - name: Stop node_exporter service
      ansible.builtin.systemd:
        name: node_exporter
        state: stopped
        enabled: no
        daemon_reload: yes
      ignore_errors: yes

    - name: Remove node_exporter binary
      ansible.builtin.file:
        path: "{{ node_exporter_install_dir }}/node_exporter"
        state: absent

    - name: Remove systemd service file
      ansible.builtin.file:
        path: "{{ node_exporter_systemd_service }}"
        state: absent

    - name: Reload systemd
      ansible.builtin.command: systemctl daemon-reload

    - name: Remove node_exporter user
      ansible.builtin.user:
        name: node_exporter
        state: absent
      ignore_errors: yes

    - name: Remove node_exporter group
      ansible.builtin.group:
        name: node_exporter
        state: absent
      ignore_errors: yes
